<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Foodie account.">
  <title>Register | Foodie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="../index.html" aria-label="Foodie home">Foodie<span>.</span></a>
      <div class="auth-nav-links">
        <a href="../index.html">Home</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="register-title">
      <p class="eyebrow">Join Foodie today</p>
      <h1 id="register-title">Create your account</h1>
      <p class="auth-intro">Sign up to enjoy your favourite meals, delivered fast.</p>

      <div id="form-message" class="form-message" role="alert" aria-live="polite" hidden></div>

      <form id="register-form" class="auth-form">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>

        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>

        <button id="register-button" class="button button-primary" type="submit">Create account <span aria-hidden="true">→</span></button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="../js/api-config.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
