<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your Foodie account.">
  <title>Login | Foodie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="brand" href="../index.html" aria-label="Foodie home">Foodie<span>.</span></a>
      <div class="auth-nav-links">
        <a href="../index.html">Home</a>
        <a class="register-link" href="register.html">Register</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Log in to Foodie</h1>
      <p class="auth-intro">Your next delicious meal is just a few clicks away.</p>

      <div id="form-message" class="form-message" role="alert" aria-live="polite" hidden></div>

      <form id="login-form" class="auth-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button id="login-button" class="button button-primary" type="submit">Log in <span aria-hidden="true">→</span></button>
      </form>

      <p class="auth-switch">New to Foodie? <a href="register.html">Create an account</a></p>
    </section>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>
